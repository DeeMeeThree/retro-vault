<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>RETRO_VAULT | Software</title>
    <script src="tailwindcss-3.4.17.js"></script>
    <script id="tailwind-config" src="tailwind.js"></script>
    <link href="style/style.css" rel="stylesheet"/>
    <link href="style/software.css" rel="stylesheet"/>
    <link href="images/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png"/>
    <link href="images/favicon.png" rel="icon" sizes="1024x1024" type="image/png"/>
</head>
<body class="font-body-md antialiased min-w-[320px] overflow-x-hidden selection:bg-neon-pink selection:text-surface-deep">
<!-- Scanline Overlay -->
<div class="fixed inset-0 scanlines"></div>
<div class="fixed inset-0 ambient-glow-pink pointer-events-none -z-10"></div>
<div class="fixed inset-0 ambient-glow-cyan pointer-events-none -z-10"></div>
<div class="fixed inset-0 grid-bg pointer-events-none -z-10"
     style="transform: perspective(500px) rotateX(60deg) translate(-9.1875px, 1.19048px);"></div>
<!-- TopNavBar -->
<header class="fixed top-0 w-full z-40 bg-surface/70 backdrop-blur-xl border-b border-glass-border shadow-[0_4px_20px_rgba(0,255,255,0.15)]">
    <div class="relative flex justify-between items-center w-full px-lg py-md max-w-container-max mx-auto">
        <a class="font-display-lg text-headline-lg tracking-tighter drop-shadow-[0_0_10px_rgba(255,0,255,0.8)] italic -skew-x-12"
           href="index.html">
            RETRO_VAULT
        </a>
        <div>
            <div class="hidden sm:flex items-center gap-9">
                <a class="text-electric-cyan border-b-2 border-electric-cyan pb-1 font-label-caps text-label-caps uppercase hover:border-electric-cyan hover:drop-shadow-[0_0_8px_#00FFFF] transition-all duration-300"
                   href="#">Software</a>
                <a class="text-on-surface-variant font-label-caps text-label-caps uppercase hover:text-neon-pink hover:drop-shadow-[0_0_8px_#FF00FF] transition-all duration-300"
                   href="hardware.html">Hardware</a>
                <a class="text-on-surface-variant font-label-caps text-label-caps uppercase hover:text-neon-pink hover:drop-shadow-[0_0_8px_#FF00FF] transition-all duration-300"
                   href="cabinet.html">Collection</a>
            </div>

            <div class="flex flex-1 justify-end items-center gap-4 md:gap-8">
                <button class="sm:hidden text-white flex flex-col items-center justify-center gap-[5px] p-1" id="mobile-menu-btn" aria-label="Menu" aria-expanded="false">
                    <span class="ham-line w-6 h-[2px] bg-current transition-transform duration-300"></span>
                    <span class="ham-line w-6 h-[2px] bg-current transition-transform duration-300"></span>
                    <span class="ham-line w-6 h-[2px] bg-current transition-transform duration-300"></span>
                </button>
            </div>
        </div>
        <!-- Mobile Menu Overlay -->
        <div class="absolute top-full right-lg min-w-[220px] bg-surface/70 backdrop-blur-xl border border-glass-border rounded-b-xl shadow-xl overflow-hidden hidden sm:hidden flex-col"
             id="mobile-menu">
            <a class="text-electric-cyan border-b-2 border-electric-cyan pb-1 font-medium py-4 px-6 hover:bg-electric-cyan/10 transition-colors"
               href="#">Software</a>
            <a class="text-on-surface-variant text-base font-medium py-4 px-6 hover:bg-electric-cyan/10 transition-colors"
               href="hardware.html">Hardware</a>
            <a class="text-on-surface-variant text-base font-medium py-4 px-6 hover:bg-electric-cyan/10 transition-colors"
               href="cabinet.html">Collection</a>
        </div>
    </div>
</header>
<!-- Main Content: Interactive Vault -->
<main class="max-w-container-max mx-auto px-md md:px-lg py-xl pt-[120px] relative z-10">
    <!-- Controls -->
    <div class="flex flex-col gap-md mb-xl">
        <div class="relative z-20 bg-surface-container/60 backdrop-blur-md p-lg rounded-xl border border-glass-border flex flex-col md:flex-row justify-between items-center gap-md">
            <div class="flex flex-row items-center justify-between gap-sm w-full md:w-auto">
                <div class="flex-1 min-w-0 pr-2">
                    <span class="font-display-lg text-headline-lg text-white italic uppercase tracking-tighter drop-shadow-[0_0_15px_rgba(255,255,255,0.8)] truncate block">SOFTWARE</span>
                    <span id="game-count" class="block font-label-caps text-label-caps text-on-surface-variant/70"></span>
                </div>
                <button id="options-btn"
                        class="md:hidden inline-flex items-center gap-sm rounded-full border border-glass-border bg-surface-container px-md py-sm text-on-surface-variant font-label-caps text-label-caps uppercase hover:border-electric-cyan hover:bg-electric-cyan hover:text-black hover:shadow-[0_0_12px_rgba(0,255,255,0.25)] transition-all"
                        aria-label="Filtres" aria-expanded="false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                        <line x1="4" y1="21" x2="4" y2="14"></line>
                        <line x1="4" y1="10" x2="4" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12" y2="3"></line>
                        <line x1="20" y1="21" x2="20" y2="16"></line>
                        <line x1="20" y1="12" x2="20" y2="3"></line>
                        <line x1="1" y1="14" x2="7" y2="14"></line>
                        <line x1="9" y1="8" x2="15" y2="8"></line>
                        <line x1="17" y1="16" x2="23" y2="16"></line>
                        <line x1="17" y1="12" x2="23" y2="12"></line>
                    </svg>
                    Filtres
                </button>
            </div>
            <div id="options-panel" class="overflow-hidden">
                <div class="grid grid-cols-[auto_auto] items-center gap-x-sm gap-y-md justify-end min-h-0">
                <label for="console-filter-btn" class="font-label-caps text-label-caps text-on-surface-variant uppercase">Console</label>
                <div class="relative">
                    <button type="button" id="console-filter-btn"
                            class="inline-flex items-center justify-between gap-md min-w-[140px] bg-transparent border border-glass-border rounded px-md py-sm text-on-surface-variant font-label-caps text-label-caps uppercase hover:border-electric-cyan hover:bg-electric-cyan hover:text-black transition-all cursor-pointer"
                            aria-haspopup="listbox" aria-expanded="false">
                        <span id="console-filter-label">Toutes</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                </div>
                    <label for="console-filter" class="hidden"></label><select id="console-filter" class="hidden">
                    <option value="">Toutes</option>
                    <option value="SEGA">Megadrive II</option>
                    <option value="PS1">PS1</option>
                    <option value="PS2">PS2</option>
                    <option value="PS3">PS3</option>
                    <option value="PS4">PS4</option>
                    <option value="PS5">PS5</option>
                </select>
                <span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Trier</span>
                <div class="flex gap-sm flex-wrap">
                    <button class="sort-btn inline-flex items-center gap-1 px-md py-sm rounded border border-glass-border text-on-surface-variant font-label-caps text-label-caps uppercase hover:border-electric-cyan hover:bg-electric-cyan hover:text-black hover:shadow-[0_0_15px_rgba(0,255,255,0.8)] transition-all"
                            data-sort="title">
                        Titre
                        <span class="sort-arrow invisible text-[10px] leading-none inline-block transition-transform duration-300">▲</span>
                    </button>
                    <button class="sort-btn inline-flex items-center gap-1 px-md py-sm rounded border border-electric-cyan text-electric-cyan font-label-caps text-label-caps uppercase hover:bg-electric-cyan hover:text-black hover:shadow-[0_0_15px_rgba(0,255,255,0.8)] transition-all"
                            data-sort="year">
                        Année
                        <span class="sort-arrow invisible text-[10px] leading-none inline-block transition-transform duration-300">▲</span>
                    </button>
                    <button class="sort-btn inline-flex items-center gap-1 px-md py-sm rounded border border-glass-border text-on-surface-variant font-label-caps text-label-caps uppercase hover:border-electric-cyan hover:bg-electric-cyan hover:text-black hover:shadow-[0_0_15px_rgba(0,255,255,0.8)] transition-all"
                            data-sort="note">
                        Metacritic
                        <span class="sort-arrow invisible text-[10px] leading-none inline-block transition-transform duration-300">▲</span>
                    </button>
                    <button class="sort-btn inline-flex items-center gap-1 px-md py-sm rounded border border-glass-border text-on-surface-variant font-label-caps text-label-caps uppercase hover:border-electric-cyan hover:bg-electric-cyan hover:text-black hover:shadow-[0_0_15px_rgba(0,255,255,0.8)] transition-all"
                            data-sort="ign">
                        IGN
                        <span class="sort-arrow invisible text-[10px] leading-none inline-block transition-transform duration-300">▲</span>
                    </button>
                    <button class="sort-btn inline-flex items-center gap-1 px-md py-sm rounded border border-glass-border text-on-surface-variant font-label-caps text-label-caps uppercase hover:border-electric-cyan hover:bg-electric-cyan hover:text-black hover:shadow-[0_0_15px_rgba(0,255,255,0.8)] transition-all"
                            data-sort="jvc">
                        JVC
                        <span class="sort-arrow invisible text-[10px] leading-none inline-block transition-transform duration-300">▲</span>
                    </button>
                </div>
                </div>
            </div>
        </div>
        <div class="w-full">
            <label for="search-input"></label><input
                class="w-full bg-surface-container/60 backdrop-blur-md border border-glass-border rounded-xl p-md text-on-surface focus:border-electric-cyan focus:outline-none focus:ring-1 focus:ring-electric-cyan transition-colors font-label-caps text-label-caps"
                id="search-input" placeholder="RECHERCHER PAR TITRE..." type="text"/>
        </div>
    </div>
    <!-- Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-lg" id="games-grid"></div>
</main>
<button id="toggle-view-btn" class="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full bg-surface-container border border-glass-border shadow-[0_0_15px_rgba(0,255,255,0.3)] flex items-center justify-center hover:border-electric-cyan hover:shadow-[0_0_20px_rgba(0,255,255,0.5)] transition-all duration-300 cursor-pointer" aria-label="Basculer la vue" data-view="grid">
    <svg id="toggle-view-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-electric-cyan transition-transform duration-400">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
    </svg>
</button>
<!-- Console dropdown: direct child of body so position:fixed escapes filtered/transformed ancestors -->
<div id="console-filter-options" class="hidden rounded bg-surface-container border border-glass-border shadow-xl overflow-hidden w-max max-w-full">
    <button type="button" data-console="" class="console-option block w-full text-left px-md py-sm font-label-caps text-label-caps uppercase text-electric-cyan hover:bg-electric-cyan hover:text-black transition-colors">Toutes</button>
    <button type="button" data-console="SEGA" class="console-option block w-full text-left px-md py-sm font-label-caps text-label-caps uppercase text-on-surface-variant hover:bg-electric-cyan hover:text-black transition-colors">Megadrive II</button>
    <button type="button" data-console="PS1" class="console-option block w-full text-left px-md py-sm font-label-caps text-label-caps uppercase text-on-surface-variant hover:bg-electric-cyan hover:text-black transition-colors">PS1</button>
    <button type="button" data-console="PS2" class="console-option block w-full text-left px-md py-sm font-label-caps text-label-caps uppercase text-on-surface-variant hover:bg-electric-cyan hover:text-black transition-colors">PS2</button>
    <button type="button" data-console="PS3" class="console-option block w-full text-left px-md py-sm font-label-caps text-label-caps uppercase text-on-surface-variant hover:bg-electric-cyan hover:text-black transition-colors">PS3</button>
    <button type="button" data-console="PS4" class="console-option block w-full text-left px-md py-sm font-label-caps text-label-caps uppercase text-on-surface-variant hover:bg-electric-cyan hover:text-black transition-colors">PS4</button>
    <button type="button" data-console="PS5" class="console-option block w-full text-left px-md py-sm font-label-caps text-label-caps uppercase text-on-surface-variant hover:bg-electric-cyan hover:text-black transition-colors">PS5</button>
</div>
<!-- Footer -->
<footer class="w-full mt-xl bg-surface-container-lowest border-t border-glass-border z-10 relative">
    <div class="flex flex-col md:flex-row justify-between items-center w-full px-lg py-xl max-w-container-max mx-auto gap-md">
        <div class="font-headline-lg text-headline-lg text-secondary italic">
            RETRO_VAULT
        </div>
        <div class="font-label-caps text-label-caps text-neon-pink">
            © 2026 RETRO_VAULT ARCHIVE. NO RIGHTS RESERVED.
        </div>
    </div>
</footer>
<script src="script/script.js"></script>
<script src="script/software.js"></script>
</body>
</html>
